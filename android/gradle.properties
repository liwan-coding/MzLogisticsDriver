# The Flutter template reserves 8G heap and 4G metaspace. That exhausts a 16 GB
# machine and the Gradle daemon dies during release builds.
org.gradle.jvmargs=-Xmx2G -XX:MaxMetaspaceSize=512m -XX:ReservedCodeCacheSize=256m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
# This newDsl flag was added by the Flutter template
android.newDsl=false
# This builtInKotlin flag was added by the Flutter template
android.builtInKotlin=false
# Kotlin incremental caches fail on Windows when the project (D:) and Pub cache (C:) are on different drives.
kotlin.incremental=false
kotlin.compiler.execution.strategy=in-process
